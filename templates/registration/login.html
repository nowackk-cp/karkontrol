{% extends "base.html" %}
{% block title %}Giriş · KârKontrol{% endblock %}
{% block content %}
<section class="card">
  <h1>Hesabına giriş yap</h1>
  {% if form.errors %}<div data-testid="login-errors">{{ form.errors }}</div>{% endif %}
  <form method="post" data-testid="login-form">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" data-testid="login-submit">Giriş yap</button>
  </form>
</section>
{% endblock %}
