{% extends "base.html" %}
{% block title %}Mağaza ekle · KârKontrol{% endblock %}
{% block content %}
<section class="card">
  <a href="{% url 'stores:list' %}">← Mağazalarım</a>
  <h1>Mağazanı ekle</h1>
  <p>Burada kullanılan pazaryeri eğitim amaçlı demo kurallarıyla çalışır.</p>
  <form method="post" data-testid="store-form">
    {% csrf_token %}<div data-testid="store-errors">{{ form.errors }}</div>{{ form.as_p }}
    <button type="submit" data-testid="store-save">Mağazayı oluştur</button>
  </form>
</section>
{% endblock %}
