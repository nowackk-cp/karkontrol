name: Frozen prompt holdout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v4
        with:
          path: .local/llm
          key: qwen3-1.7b-q8-b11382-linux-v1
      - run: uv run python scripts/setup_local_llm.py
      - name: Start frozen model
        run: |
          mkdir -p reports/holdout
          runtime=$(find .local/llm/runtime -type f -name llama-server -print -quit)
          test -n "$runtime"
          "$runtime" -m .local/llm/Qwen3-1.7B-Q8_0.gguf --host 127.0.0.1 --port 8081 -c 4096 -t 4 --parallel 1 --jinja > reports/holdout/model-server.log 2>&1 &
          echo "$!" > reports/holdout/model-server.pid
          uv run python scripts/wait_local_llm.py
      - run: uv run python manage.py migrate --noinput
      - name: Freeze prompt, generate questions, evaluate once
        run: |
          frozen=$(sha256sum apps/assistant/prompts/v2.txt | cut -d' ' -f1)
          echo "$frozen" > reports/holdout/prompt.sha256
          uv run python manage.py generate_holdout --prompt-sha256 "$frozen"
          test "$frozen" = "$(sha256sum apps/assistant/prompts/v2.txt | cut -d' ' -f1)"
          uv run python manage.py evaluate_assistant --backend local --versions v2 --cases reports/holdout/questions.jsonl --output reports/holdout/eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-holdout
          path: reports/holdout/
          retention-days: 30
      - name: Stop own model
        if: always()
        run: |
          if [ -f reports/holdout/model-server.pid ]; then kill "$(cat reports/holdout/model-server.pid)" 2>/dev/null || true; fi
