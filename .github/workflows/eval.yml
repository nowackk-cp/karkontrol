name: Assistant eval
on:
  pull_request:
    paths: ['apps/assistant/**', 'tests/eval/**', '.github/workflows/eval.yml']
  push:
    branches: [main]
    paths: ['apps/assistant/**', 'tests/eval/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
      - run: uv sync --locked --extra dev
      - run: uv run python -m pytest tests/eval --junitxml=reports/eval.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: reports/eval.xml
