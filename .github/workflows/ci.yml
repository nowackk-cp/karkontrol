name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra e2e
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Django configuration
        run: uv run python manage.py check
      - name: Migration drift
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Unit tests
        run: uv run python -m pytest tests/unit -n 2 -m 'not e2e and not reconciliation' --cov --cov-report= --html=reports/unit.html --self-contained-html --junitxml=reports/unit.xml
      - name: Integration tests
        run: uv run python -m pytest tests/integration -n 2 -m 'not e2e and not reconciliation' --cov --cov-append --cov-report= --html=reports/integration.html --self-contained-html --junitxml=reports/integration.xml
      - name: Offline assistant eval
        run: uv run python -m pytest tests/eval -n 2 -m 'not e2e and not reconciliation' --cov --cov-append --cov-report= --html=reports/eval.html --self-contained-html --junitxml=reports/eval.xml
      - name: Tests outside named layers
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          result = subprocess.call([
              sys.executable, '-m', 'pytest', 'tests', '-n', '2',
              '--ignore=tests/unit', '--ignore=tests/integration', '--ignore=tests/eval',
              '--ignore=tests/e2e', '--ignore=tests/reconciliation',
              '-m', 'not e2e and not reconciliation', '--cov', '--cov-append', '--cov-report=',
              '--html=reports/other.html', '--self-contained-html', '--junitxml=reports/other.xml',
          ])
          # pytest 5 is only "no tests collected"; errors/failures remain blocking.
          raise SystemExit(0 if result == 5 else result)
          PY
      - name: Combined coverage reports
        run: |
          uv run python -m coverage html
          uv run python -m coverage json -o reports/coverage.json
          uv run python -m coverage xml -o reports/coverage.xml
          uv run python -m coverage report
      - name: Engine branch coverage gate
        run: uv run python scripts/check_coverage.py reports/coverage.json
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install browser system dependencies
        run: uv run python -m playwright install-deps chromium
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: uv run python -m playwright install chromium
      - name: Critical browser workflows
        run: uv run python -m pytest tests/e2e -m e2e --browser chromium --tracing retain-on-failure --screenshot only-on-failure --junitxml=reports/e2e.xml --html=reports/e2e.html --self-contained-html
      - name: Test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            reports/
            htmlcov/
            test-results/
          if-no-files-found: ignore
          retention-days: 90
