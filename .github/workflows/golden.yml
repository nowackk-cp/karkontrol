name: Human golden reconciliation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  human-golden:
    name: human-golden
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.26'
      - run: uv sync --locked --extra dev
      - name: Human approved golden rows
        run: uv run python -m pytest tests/reconciliation -m reconciliation --junitxml=reports/golden.xml --html=reports/golden.html --self-contained-html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: human-golden-reconciliation
          path: reports/golden.*
          retention-days: 90
