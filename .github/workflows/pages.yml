name: Publish QA reports
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: public
      - name: Report index
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import html, json, os, pathlib
          report = json.loads(pathlib.Path('public/reports/coverage.json').read_text())
          coverage = report['totals']['percent_covered_display']
          page = f'''<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KârKontrol QA raporları</title><style>body{{max-width:800px;margin:64px auto;padding:24px;font:18px/1.7 system-ui;color:#182a35;background:#f3f6f8}}a{{color:#136454}}code{{overflow-wrap:anywhere}}</style><h1>KârKontrol QA raporları</h1><p>Başarılı ana dal CI çalışmasının gerçek çıktıları.</p><p>Toplam satır ve dal kapsamı: %{html.escape(coverage)}</p><ul><li><a href="reports/tests.html">Pytest sonuçları</a></li><li><a href="htmlcov/index.html">Kapsam raporu</a></li><li><a href="reports/e2e.xml">12 Chromium E2E JUnit çıktısı</a></li><li><a href="{html.escape(os.environ['RUN_URL'])}">Kaynak CI çalışması</a></li></ul><p>Commit: <code>{html.escape(os.environ['COMMIT_SHA'])}</code></p><p>İnsan altın veri kabulü, gerçek LLM ve judge ölçümü bu raporun kapsamına girmez.</p></html>'''
          pathlib.Path('public/index.html').write_text(page)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
