.line{fill:none;stroke:url(#g);stroke-width:3;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.4s ease-out forwards}
.mark{opacity:0;animation:show .5s ease-out forwards}
.pulse{fill:none;stroke:#ff5d73;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes show{to{opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}.mark{animation:none;opacity:1}.pulse{animation:none}}
</style>
